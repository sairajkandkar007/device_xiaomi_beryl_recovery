name: AERA Recovery - Beryl Build

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: fox_14.1
        type: choice
        options:
          - fox_14.1
      BUILD_TARGET:
        description: Image target for Beryl (vendor_boot recovery)
        required: true
        default: vendorbootimage
        type: choice
        options:
          - vendorbootimage
          - recoveryimage
      JOBS:
        description: Parallel build jobs (keep low on GitHub-hosted runners)
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

jobs:
  build:
    name: AERA 16.0 / beryl
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: aera-16.0
      DEVICE_TREE_URL: https://github.com/sairajkandkar007/device_xiaomi_beryl_recovery.git
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: device/xiaomi/beryl
      DEVICE_NAME: beryl
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      BUILD_JOBS: ${{ inputs.JOBS }}

    steps:
      - name: Free runner disk space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential brotli ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libc6-dev-i386 \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils \
            lzop m4 pngcrush python3 python3-pip python3-yaml rsync \
            schedtool squashfs-tools unzip xsltproc zip zlib1g-dev
          git lfs install --skip-repo

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install repo tool
        run: |
          set -euxo pipefail
          mkdir -p "${HOME}/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod 0755 "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "$GITHUB_PATH"

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Initialize AERA 16.0 manifest
        run: |
          set -euxo pipefail
          mkdir -p AERA_16.0
          cd AERA_16.0
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j2

      - name: Clone Beryl device tree
        run: |
          set -euxo pipefail
          case "$DEVICE_PATH" in /*|*..*) echo "Unsafe device path"; exit 1 ;; esac
          mkdir -p "AERA_16.0/$(dirname "$DEVICE_PATH")"
          git clone --depth=1 --single-branch --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" "AERA_16.0/$DEVICE_PATH"
          cd "AERA_16.0/$DEVICE_PATH"
          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate AERA device configuration
        run: |
          set -euxo pipefail
          cd "AERA_16.0/$DEVICE_PATH"
          test -s BoardConfig.mk
          test -s device.mk
          test -s AndroidProducts.mk
          test -s twrp_beryl.mk
          test -s aera_beryl.mk
          grep -q 'AERA_INCLUDE_CRYPTO' BoardConfig.mk
          grep -q 'twrp_beryl-bp2a-eng' AndroidProducts.mk
          if grep -Eiq 'orangefox_soong\.mk|bootable/recovery/orangefox|^[[:space:]]*(FOX|OF|PB)_[A-Za-z0-9_]*[[:space:]]*[:?+]?=' BoardConfig.mk; then
            echo "OrangeFox/PBRP build flags remain in BoardConfig.mk"
            exit 1
          fi

      - name: Build AERA vendor_boot / recovery image
        shell: bash
        run: |
          set -eo pipefail
          cd AERA_16.0
          export AERA_BUILD_DEVICE=beryl
          set +u
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_beryl-bp2a-eng
          set -u
          mka adbd "$BUILD_TARGET" -j"$BUILD_JOBS"

      - name: Collect and verify build outputs
        id: outputs
        run: |
          set -euxo pipefail
          OUT="AERA_16.0/out/target/product/$DEVICE_NAME"
          test -d "$OUT"
          mkdir -p build-artifacts
          found=0
          for image in vendor_boot.img recovery.img; do
            if [ -s "$OUT/$image" ]; then
              cp "$OUT/$image" build-artifacts/
              sha256sum "build-artifacts/$image"
              found=1
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "No vendor_boot.img or recovery.img was produced."
            find "$OUT" -maxdepth 1 -type f -name '*.img' -printf '%f (%s bytes)\n' || true
            exit 1
          fi
          cp "$OUT"/*.zip build-artifacts/ 2>/dev/null || true
          {
            echo "### Beryl AERA build"
            echo "- Manifest: $MANIFEST_BRANCH"
            echo "- Device tree: $DEVICE_TREE_BRANCH"
            echo "- Device tree commit: $DEVICE_TREE_COMMIT"
            echo "- Requested target: $BUILD_TARGET"
            echo
            echo "#### SHA-256"
            sha256sum build-artifacts/*.img
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AERA-beryl-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
