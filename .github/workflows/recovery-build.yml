name: Recovery Build
on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: TWRP manifest URL
        required: true
        default: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp
      MANIFEST_BRANCH:
        description: Manifest branch
        required: true
        default: twrp-14.1
      DEVICE_TREE_URL:
        description: Device tree URL
        required: true
        default: https://github.com/IQ-HARRY7/device_xiaomi_beryl_recovery
      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: fox_14.1
      DEVICE_PATH:
        description: Device tree path
        required: true
        default: device/xiaomi/beryl
      COMMON_TREE_URL:
        description: Optional common tree URL
        required: false
      COMMON_PATH:
        description: Optional common tree path
        required: false
      COMMON_TREE_BRANCH:
        description: Optional common tree branch
        required: false
      DEVICE_NAME:
        description: Device name
        required: true
        default: beryl
      MAKEFILE_NAME:
        description: TWRP product makefile
        required: true
        default: twrp_beryl
      BUILD_TARGET:
        description: Image target (vendorboot or recovery)
        required: true
        default: vendorboot

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      COMMON_TREE_URL: ${{ inputs.COMMON_TREE_URL }}
      COMMON_PATH: ${{ inputs.COMMON_PATH }}
      COMMON_TREE_BRANCH: ${{ inputs.COMMON_TREE_BRANCH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      MAKEFILE_NAME: ${{ inputs.MAKEFILE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euxo pipefail
          # Avoid third-party cleanup actions that install kernel-version-specific packages.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential brotli ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libc6-dev-i386 liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop m4 pngcrush python3 python3-yaml rsync \
            schedtool squashfs-tools unzip xsltproc zip zlib1g-dev
          git lfs install --skip-repo

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Configure SSH for private repositories
        if: ${{ startsWith(inputs.MANIFEST_URL, 'git@github.com:') || startsWith(inputs.DEVICE_TREE_URL, 'git@github.com:') || (inputs.COMMON_TREE_URL != '' && startsWith(inputs.COMMON_TREE_URL, 'git@github.com:')) }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install repo tool
        run: |
          set -euxo pipefail
          mkdir -p "${HOME}/bin"
          curl --fail --location --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "${HOME}/bin/repo"
          chmod 0755 "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync manifest
        run: |
          set -euxo pipefail
          mkdir -p workspace
          cd workspace
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          repo sync -c -j2 --force-sync --no-clone-bundle --optimized-fetch

      - name: Clone device tree
        run: |
          set -euxo pipefail
          case "$DEVICE_PATH" in /*|*..*) echo "Unsafe DEVICE_PATH"; exit 1;; esac
          mkdir -p "workspace/$(dirname "$DEVICE_PATH")"
          git clone --depth=1 --single-branch --branch "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "workspace/$DEVICE_PATH"

      - name: Clone optional common tree
        if: ${{ inputs.COMMON_TREE_URL != '' && inputs.COMMON_PATH != '' }}
        run: |
          set -euxo pipefail
          case "$COMMON_PATH" in /*|*..*) echo "Unsafe COMMON_PATH"; exit 1;; esac
          branch="$COMMON_TREE_BRANCH"
          if [ -z "$branch" ]; then branch="$DEVICE_TREE_BRANCH"; fi
          mkdir -p "workspace/$(dirname "$COMMON_PATH")"
          git clone --depth=1 --single-branch --branch "$branch" "$COMMON_TREE_URL" "workspace/$COMMON_PATH"

      - name: Prepare device tree for TWRP
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          root = Path("workspace") / os.environ["DEVICE_PATH"]
          device = os.environ["DEVICE_NAME"]
          product = os.environ["MAKEFILE_NAME"]
          board = root / "BoardConfig.mk"
          device_mk = root / "device.mk"
          if not board.is_file() or not device_mk.is_file():
              raise SystemExit("Device tree must contain BoardConfig.mk and device.mk")

          # Remove OrangeFox/PitchBlack-specific make assignments and includes only.
          for path in (board, device_mk):
              lines = path.read_text().splitlines()
              kept = []
              for line in lines:
                  if re.match(r"^\s*-?include\s+.*orangefox.*\.mk\s*$", line, re.I):
                      continue
                  if re.match(r"^\s*(?:FOX|OF|PB)_[A-Za-z0-9_]*\s*[:?+]*=", line):
                      continue
                  kept.append(line)
              path.write_text("\n".join(kept) + "\n")

          # TWRP product definition; use a quoted Python template so $(...) is
          # written literally instead of being interpreted as shell substitution.
          (root / "AndroidProducts.mk").write_text(
              "PRODUCT_MAKEFILES := \\\n"
              "    $(LOCAL_DIR)/" + product + ".mk\n\n"
              "COMMON_LUNCH_CHOICES := \\\n"
              "    " + product + "-ap2a-eng \\\n"
              "    " + product + "-ap2a-userdebug\n"
          )
          product_text = """# TWRP product for Beryl
          NOT_ORANGEFOX := 1
          $(call inherit-product, $(SRC_TARGET_DIR)/product/base.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit_only.mk)
          $(call inherit-product, vendor/twrp/config/common.mk)
          $(call inherit-product, device/xiaomi/beryl/device.mk)

          PRODUCT_DEVICE := @DEVICE@
          PRODUCT_NAME := @PRODUCT@
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi
          PRODUCT_PROPERTY_OVERRIDES += ro.twrp.vendor_boot=true
          """
          product_text = "\n".join(line[10:] if line.startswith("          ") else line for line in product_text.splitlines()) + "\n"
          product_text = product_text.replace("@DEVICE@", device).replace("@PRODUCT@", product)
          (root / (product + ".mk")).write_text(product_text)

          # Do not let the old OrangeFox lunch script or products register.
          (root / "vendorsetup.sh").unlink(missing_ok=True)
          for pattern in ("fox_*.mk", "pb_*.mk"):
              for path in root.glob(pattern):
                  path.unlink()

          # Fail closed if OrangeFox-specific build hooks remain active.
          for path in (board, device_mk, root / "AndroidProducts.mk", root / (product + ".mk")):
              content = path.read_text()
              if re.search(r"orangefox_soong\.mk|bootable/recovery/orangefox|(?:^|\n)\s*(?:FOX|OF|PB)_[A-Za-z0-9_]*\s*[:?+]?=", content, re.I):
                  raise SystemExit(f"OrangeFox/PitchBlack build hook remains in {path}")
          PY

      - name: Resolve device dependencies
        run: |
          set -euxo pipefail
          cd workspace
          python3 - "$DEVICE_PATH" <<'PY'
          import subprocess, sys
          from pathlib import Path
          import yaml

          device = Path(sys.argv[1])
          depfile = next((p for p in (device / "twrp.dependencies", device / "omni.dependencies", device / "fox.dependencies") if p.is_file()), None)
          if depfile is None:
              print("No supported dependency manifest found; skipping optional device-tree dependencies.")
              raise SystemExit(0)
          entries = yaml.safe_load(depfile.read_text()) or []
          if not isinstance(entries, list):
              raise SystemExit(f"Unsupported dependency format: {depfile}")
          for item in entries:
              if not isinstance(item, dict):
                  raise SystemExit(f"Invalid dependency entry: {item!r}")
              url = item.get("repository") or item.get("url")
              path = item.get("target_path") or item.get("path")
              branch = item.get("branch")
              if not url or not path:
                  raise SystemExit(f"Dependency missing repository/url or target_path/path: {item!r}")
              target = Path(path)
              if target.is_absolute() or ".." in target.parts:
                  raise SystemExit(f"Unsafe dependency path: {path}")
              if target.exists():
                  print(f"Dependency path already exists; keeping it: {target}")
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              cmd = ["git", "clone", "--depth=1"]
              if branch:
                  cmd += ["--single-branch", "--branch", str(branch)]
              subprocess.run(cmd + [str(url), str(target)], check=True)
          PY
          repo sync -c -j2 --force-sync --no-clone-bundle --optimized-fetch

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Inspect TWRP kernel build rules
        run: |
          set -eu
          cd workspace
          kernel_mk="vendor/twrp/build/tasks/kernel.mk"
          if [ ! -f "$kernel_mk" ]; then
            echo "TWRP kernel.mk not found at $kernel_mk"
            find vendor -path '*/build/tasks/kernel.mk' -print 2>/dev/null | head -n 30 || true
            exit 1
          fi
          echo "=== $kernel_mk lines 575-610 ==="
          nl -ba "$kernel_mk" | sed -n '575,610p'
          echo "=== Whitespace-visible view ==="
          sed -n '575,610p' "$kernel_mk" | cat -vet

      - name: Build recovery image
        run: |
          set -eo pipefail
          cd workspace
          # Android/TWRP envsetup is not compatible with Bash nounset during initialization.
          set +u
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch "${MAKEFILE_NAME}-ap2a-eng"
          set -u
          make "${BUILD_TARGET}image" -j2

      - name: Verify output image
        id: output
        run: |
          set -euxo pipefail
          case "$BUILD_TARGET" in
            vendorboot) image="workspace/out/target/product/$DEVICE_NAME/vendor_boot.img" ;;
            recovery) image="workspace/out/target/product/$DEVICE_NAME/recovery.img" ;;
            *) echo "Unsupported BUILD_TARGET: $BUILD_TARGET"; exit 1 ;;
          esac
          test -s "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          sha256sum "$image"

      - name: Publish build release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.output.outputs.image }}
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*vendor*.img
          name: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: recovery-build-${{ github.run_id }}
          body: |
            Manifest: ${{ inputs.MANIFEST_BRANCH }}
            Device tree: ${{ inputs.DEVICE_TREE_URL }} (${{ inputs.DEVICE_TREE_BRANCH }})
            Device: ${{ inputs.DEVICE_NAME }}
            Target: ${{ inputs.BUILD_TARGET }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
